<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-3">
    <a class="navbar-brand" href="/admin">← Admin Dashboard</a>
    <form th:action="@{/logout}" method="post" class="d-inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-outline-light">Logout</button>
    </form>
</nav>

<div class="container mt-4" style="max-width:520px;">
    <h2 class="mb-4">Edit User</h2>

    <form th:action="@{'/admin/users/' + ${user.id} + '/edit'}" th:object="${user}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" th:field="*{username}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Password <span class="text-muted small">(leave blank to keep current)</span></label>
            <input type="password" th:field="*{password}" class="form-control" autocomplete="new-password">
        </div>
        <div class="mb-3">
            <label class="form-label">Role</label>
            <select th:field="*{role}" class="form-select">
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Save Changes</button>
            <a class="btn btn-secondary" href="/admin">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
