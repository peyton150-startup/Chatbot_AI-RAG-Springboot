<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:style="'--chat-header:' + (${theme.headerColor} ?: '#0d6efd') +
                '; --chat-bg:' + (${theme.backgroundColor} ?: '#ffffff') +
                '; --chat-text:' + (${theme.textColor} ?: '#000000') +
                '; --chat-icon:' + (${theme.iconColor} ?: '#0d6efd') +
                '; --chat-chip-bg:' + (${theme.chipBackgroundColor} ?: '#f0f0f0') +
                '; --chat-chip-hover:' + (${theme.chipHoverColor} ?: '#e0e0e0') +
                '; --chat-chip-border:' + (${theme.chipBorderColor} ?: '#ccc')">

<head>
    <meta charset="UTF-8" />
    <title>Chat</title>
    <style>
        :root {
            --chat-header: #0d6efd;
            --chat-bg: #ffffff;
            --chat-text: #000000;
            --chat-icon: #0d6efd;
            --chat-chip-bg: #f0f0f0;
            --chat-chip-hover: #e0e0e0;
            --chat-chip-border: #ccc;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: transparent;
        }

        @keyframes bubbleFadeIn {
            from {
                opacity: 0;
                transform: scale(0.6);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #chatBubble {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 60px;
            height: 60px;
            background: var(--chat-icon);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 99999;
            overflow: hidden;
            visibility: hidden;
        }

        #chatBubble.visible {
            visibility: visible;
            animation: bubbleFadeIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @media (max-width: 768px) {
            #chatBubble {
                bottom: 16px;
                right: 16px;
            }

            #chatWindow {
                bottom: 90px;
                right: 16px;
                width: calc(100vw - 32px);
            }
        }

        #chatBubble img#bubbleAvatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            display: none;
        }

        #chatWindow {
            position: fixed;
            bottom: 100px;
            right: 24px;
            width: 360px;
            height: 560px;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            display: none;
            flex-direction: column;
            z-index: 99999;
            overflow: hidden;
        }

        #chatBanner {
            display: none;
            width: 100%;
            height: 120px;
            object-fit: cover;
            object-position: center top;
            flex-shrink: 0;
        }

        #chatHeader {
            padding: 10px 14px;
            background: var(--chat-header);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        #chatHeader img#headerAvatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 8px;
            display: none;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        #suggestions {
            display: flex;
            gap: 8px;
            padding: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }

        #suggestions:empty {
            display: none;
        }

        .chip {
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--chat-chip-border);
            background: var(--chat-chip-bg);
            font-size: 12px;
            cursor: pointer;
        }

        .chip:hover {
            background: var(--chat-chip-hover);
        }

        /* Lead capture form */
        #leadForm {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--chat-bg);
            flex: 1;
            justify-content: center;
        }

        #leadForm h4 {
            margin: 0;
            color: var(--chat-text);
            font-size: 15px;
        }

        #leadForm p {
            margin: 0;
            font-size: 13px;
            color: #666;
        }

        #leadForm input {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 13px;
            outline: none;
        }

        #leadForm input:focus {
            border-color: var(--chat-header);
        }

        #leadForm button.primary {
            background: var(--chat-icon);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        #leadForm button.skip {
            background: none;
            border: none;
            color: #999;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
            align-self: center;
        }

        #chatMessages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            background: var(--chat-bg);
            color: var(--chat-text);
            font-size: 13px;
        }

        .msg {
            margin-bottom: 10px;
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 14px;
            line-height: 1.4;
        }

        .msg.user {
            margin-top: 12px;
            background: var(--chat-header);
            color: white;
            align-self: flex-end;
        }

        .user {
            background: var(--chat-icon);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .bot {
            background: #eee;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .typing span {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #999;
            border-radius: 50%;
            margin: 0 2px;
            animation: blink 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .2s;
        }

        .typing span:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes blink {

            0%,
            80%,
            100% {
                opacity: 0;
            }

            40% {
                opacity: 1;
            }
        }

        /* Rating row */
        .rating-row {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            margin-bottom: 6px;
        }

        .rating-btn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 12px;
            cursor: pointer;
            color: #666;
        }

        .rating-btn:hover {
            background: #f0f0f0;
        }

        .rating-btn.active-up {
            background: #d4edda;
            border-color: #28a745;
            color: #28a745;
        }

        .rating-btn.active-down {
            background: #f8d7da;
            border-color: #dc3545;
            color: #dc3545;
        }

        /* Booking button */
        .booking-btn {
            display: block;
            margin-top: 12px;
            margin-bottom: 8px;
            padding: 8px 16px;
            background: var(--chat-icon);
            color: white;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        #chatInput {
            display: flex;
            padding: 10px;
            gap: 8px;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }

        #poweredBy {
            text-align: center;
            font-size: 10px;
            color: #bbb;
            padding: 4px 0 6px;
            flex-shrink: 0;
        }

        #poweredBy a {
            color: #bbb;
            text-decoration: none;
        }

        #poweredBy a:hover {
            color: #999;
        }

        .timeout-msg {
            font-style: italic;
            color: #999 !important;
            background: #f9f9f9 !important;
        }

        #chatInput textarea {
            flex: 1;
            resize: none;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 13px;
        }

        #chatInput button {
            background: var(--chat-icon);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 14px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="chatBubble">
        <img id="bubbleAvatar" src="" alt="" />
        <span id="bubbleEmoji">💬</span>
    </div>

    <div id="chatWindow">
        <img id="chatBanner" src="" alt="banner" />

        <div id="chatHeader">
            <div style="display:flex;align-items:center;">
                <img id="headerAvatar" src="" alt="" />
                <span id="headerTitle">Assistant</span>
            </div>
            <span id="closeChat" style="cursor:pointer;">✕</span>
        </div>

        <!-- Lead capture — shown before chat -->
        <div id="leadForm">
            <h4 id="lf-title">Welcome!</h4>
            <p id="lf-sub">Enter your details to start chatting.</p>
            <input type="text" id="leadName" placeholder="Your name">
            <input type="email" id="leadEmail" placeholder="Your email">
            <button class="primary" id="leadSubmit">Start Chat</button>
            <button class="skip" id="leadSkip">Skip</button>
        </div>

        <!-- Chat UI — hidden until lead form done -->
        <div id="chatUI" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
            <div id="suggestions"></div>
            <div id="chatMessages">
                <div class="bot msg" id="welcomeMsg">Hi! How can I help you today?</div>
            </div>
            <div id="poweredBy">Powered by Reilly AI</div>
            <div id="chatInput">
                <textarea id="input" rows="2"></textarea>
                <button id="send">Send</button>
            </div>
        </div>
    </div>

    <script>
        const API_CHAT = "/api/chat";
        const API_THEME = "/api/theme";
        const API_LEADS = "/api/leads";
        const API_RATE = "/api/analytics/rate";

        /**
         * localStorage key used to remember that this visitor already submitted
         * (or skipped) the lead form. Value is "1" when set.
         * We use localStorage (not sessionStorage) so it persists across browser tabs
         * and page refreshes, giving a better returning-visitor experience.
         */
        const LEAD_DONE_KEY = "chatbot_lead_done";

        // Detect browser language (e.g. "es", "fr", "en")
        const userLang = (navigator.language || "en").split("-")[0].toLowerCase();

        // Translations for UI strings
        const i18n = {
            en: {
                welcome: "Welcome!", sub: "Enter your details to start chatting.",
                namePh: "Your name", emailPh: "Your email", start: "Start Chat", skip: "Skip",
                greet: "Hi! How can I help you today?", greetSub: "How can I help you?", thinking: "Thinking…",
                serverErr: "Server error.", inputPh: "Ask a question…",
                bookBtn: "Book Appointment", send: "Send"
            },
            es: {
                welcome: "¡Bienvenido!", sub: "Ingresa tus datos para comenzar.",
                namePh: "Tu nombre", emailPh: "Tu correo", start: "Iniciar chat", skip: "Omitir",
                greet: "¡Hola! ¿En qué puedo ayudarte?", thinking: "Pensando…",
                serverErr: "Error del servidor.", inputPh: "Haz una pregunta…",
                bookBtn: "Reservar cita", send: "Enviar"
            },
            fr: {
                welcome: "Bienvenue!", sub: "Entrez vos coordonnées pour commencer.",
                namePh: "Votre nom", emailPh: "Votre email", start: "Commencer", skip: "Passer",
                greet: "Bonjour! Comment puis-je vous aider?", thinking: "Réflexion…",
                serverErr: "Erreur serveur.", inputPh: "Posez une question…",
                bookBtn: "Prendre rendez-vous", send: "Envoyer"
            },
            de: {
                welcome: "Willkommen!", sub: "Geben Sie Ihre Daten ein, um zu beginnen.",
                namePh: "Ihr Name", emailPh: "Ihre E-Mail", start: "Chat starten", skip: "Überspringen",
                greet: "Hallo! Wie kann ich Ihnen helfen?", thinking: "Denke nach…",
                serverErr: "Serverfehler.", inputPh: "Stellen Sie eine Frage…",
                bookBtn: "Termin buchen", send: "Senden"
            },
            pt: {
                welcome: "Bem-vindo!", sub: "Insira seus dados para começar.",
                namePh: "Seu nome", emailPh: "Seu email", start: "Iniciar chat", skip: "Pular",
                greet: "Olá! Como posso ajudar?", thinking: "Pensando…",
                serverErr: "Erro no servidor.", inputPh: "Faça uma pergunta…",
                bookBtn: "Agendar consulta", send: "Enviar"
            },
            zh: {
                welcome: "欢迎!", sub: "请输入您的信息开始聊天。",
                namePh: "您的姓名", emailPh: "您的邮箱", start: "开始聊天", skip: "跳过",
                greet: "您好！有什么可以帮助您？", thinking: "思考中…",
                serverErr: "服务器错误。", inputPh: "请提问…",
                bookBtn: "预约", send: "发送"
            },
            ar: {
                welcome: "مرحباً!", sub: "أدخل بياناتك للبدء في الدردشة.",
                namePh: "اسمك", emailPh: "بريدك الإلكتروني", start: "ابدأ الدردشة", skip: "تخطي",
                greet: "مرحباً! كيف يمكنني مساعدتك؟", thinking: "جاري التفكير…",
                serverErr: "خطأ في الخادم.", inputPh: "اطرح سؤالاً…",
                bookBtn: "احجز موعداً", send: "إرسال"
            },
        };
        const t = i18n[userLang] || i18n.en;

        // Random greeting variations for first-time visitors
        const firstTimeGreetings = [
            "Hi! How can I help you today?",
            "Hello! What can I help you with?",
            "Hey there! What brings you here today?",
            "Hi! What questions can I answer for you?"
        ];
        const randomGreeting = firstTimeGreetings[Math.floor(Math.random() * firstTimeGreetings.length)];

        // Apply translations to lead form
        document.getElementById('lf-title').textContent = t.welcome;
        document.getElementById('lf-sub').textContent = t.sub;
        document.getElementById('leadName').placeholder = t.namePh;
        document.getElementById('leadEmail').placeholder = t.emailPh;
        document.getElementById('leadSubmit').textContent = t.start;
        document.getElementById('leadSkip').textContent = t.skip;
        document.getElementById('welcomeMsg').textContent = randomGreeting;
        document.getElementById('input').placeholder = t.inputPh;
        document.getElementById('send').textContent = t.send;

        const bubble = document.getElementById("chatBubble");
        const windowBox = document.getElementById("chatWindow");
        const closeBtn = document.getElementById("closeChat");
        const messages = document.getElementById("chatMessages");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("send");

        bubble.onclick = () => { windowBox.style.display = "flex"; bubble.style.display = "none"; };
        closeBtn.onclick = () => { windowBox.style.display = "none"; bubble.style.display = "flex"; };

        // ── Lead form ──────────────────────────────────────────────────────────────

        /**
         * Opens the chat UI, hiding the lead capture form.
         * Also sets the localStorage flag so returning visitors skip the form entirely.
         */
        function openChat(name) {
            document.getElementById('leadForm').style.display = 'none';
            document.getElementById('chatUI').style.display = 'flex';
            try { localStorage.setItem(LEAD_DONE_KEY, '1'); } catch (e) { }
            // Personalise the welcome message if we have the visitor's name
            if (name) {
                const firstName = name.split(' ')[0];
                document.getElementById('welcomeMsg').textContent =
                    t.greet.replace('!', '') + ', ' + firstName + '! ' + t.greetSub;
            } else {
                // For returning visitors, show a different greeting
                try {
                    const visits = localStorage.getItem('chatbot_visit_count') || '0';
                    const visitCount = parseInt(visits);
                    localStorage.setItem('chatbot_visit_count', (visitCount + 1).toString());

                    if (visitCount > 0) {
                        document.getElementById('welcomeMsg').textContent = 'Welcome back! Have more questions?';
                    }
                    // First-time visitors already got randomGreeting on page load
                } catch (e) { }
            }
        }

        /**
         * Check on page load whether this visitor has already submitted or skipped
         * the lead form. If so, go straight to the chat UI.
         */
        function initLeadForm() {
            let alreadySeen = false;
            try { alreadySeen = localStorage.getItem(LEAD_DONE_KEY) === '1'; } catch (e) { }

            if (alreadySeen) {
                // Returning visitor — skip the lead form immediately
                openChat();
            }
            // New visitor — lead form is shown by default (no change needed)
        }

        document.getElementById('leadSubmit').onclick = async () => {
            const name = document.getElementById('leadName').value.trim();
            const email = document.getElementById('leadEmail').value.trim();
            if (!name && !email) { openChat(); return; }
            try {
                await fetch(API_LEADS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email })
                });
            } catch (e) { }
            openChat(name);
        };

        document.getElementById('leadSkip').onclick = () => openChat();

        // ── Messages ───────────────────────────────────────────────────────────────

        let bookingUrl = '';
        const BOOKING_KEYWORDS = ['book', 'appointment', 'schedule', 'reserve', 'rendez', 'reservar', 'buchen', 'agendar', '预约', 'حجز'];

        function detectBookingIntent(answerText, questionText) {
            if (!bookingUrl) return false;
            const lowerAnswer = answerText.toLowerCase();
            const lowerQuestion = questionText ? questionText.toLowerCase() : '';
            return BOOKING_KEYWORDS.some(k => lowerAnswer.includes(k) || lowerQuestion.includes(k));
        }

        function addMsg(text, cls) {
            const div = document.createElement("div");
            div.className = `msg ${cls}`;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function addTyping() {
            const div = document.createElement("div");
            div.className = "msg bot typing";
            div.innerHTML = "<span></span><span></span><span></span>";
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function addRating(logId) {
            const row = document.createElement("div");
            row.className = "rating-row";
            row.innerHTML = `
        <button class="rating-btn" data-id="${logId}" data-val="1">👍</button>
        <button class="rating-btn" data-id="${logId}" data-val="-1">👎</button>`;
            row.querySelectorAll('.rating-btn').forEach(btn => {
                btn.onclick = async () => {
                    const val = parseInt(btn.dataset.val);
                    await fetch(API_RATE, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: parseInt(btn.dataset.id), rating: val })
                    });
                    row.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active-up', 'active-down'));
                    btn.classList.add(val === 1 ? 'active-up' : 'active-down');
                };
            });
            messages.appendChild(row);
            messages.scrollTop = messages.scrollHeight;
        }

        function addBookingBtn() {
            const a = document.createElement("a");
            a.href = bookingUrl;
            a.target = "_blank";
            a.className = "booking-btn";
            a.textContent = t.bookBtn;
            const wrapper = document.createElement("div");
            wrapper.style.paddingLeft = "12px";
            wrapper.appendChild(a);
            messages.appendChild(wrapper);
            messages.scrollTop = messages.scrollHeight;
        }

        async function sendMsg(textOverride) {
            const text = (textOverride || input.value).trim();
            if (!text) return;

            // Disable send button while processing
            sendBtn.disabled = true;
            input.disabled = true;

            addMsg(text, "user");
            input.value = "";

            // Pass user language to backend so AI responds in correct language
            const prompt = userLang !== 'en'
                ? `[Respond in language: ${userLang}] ${text}`
                : text;

            const typing = addTyping();
            let logId = null;

            // Show a "taking longer than usual" message after 15 seconds
            // so users don't think the bot is frozen
            const slowTimer = setTimeout(() => {
                const slowMsg = document.createElement("div");
                slowMsg.className = "msg bot timeout-msg";
                slowMsg.id = "slowMsg";
                slowMsg.textContent = "Still thinking, just a moment…";
                messages.appendChild(slowMsg);
                messages.scrollTop = messages.scrollHeight;
            }, 15000);

            try {
                const res = await fetch(API_CHAT, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: prompt })
                });
                clearTimeout(slowTimer);
                document.getElementById("slowMsg")?.remove();
                if (res.status === 429) {
                    typing.remove();
                    addMsg("You're sending messages too quickly — please wait a moment.", "bot");
                    return;
                }
                const data = await res.json();
                typing.remove();
                const botDiv = addMsg(data.answer || "No response.", "bot");
                logId = data.id;

                // Check if booking button should appear based on question or answer
                if (detectBookingIntent(data.answer || "", prompt)) {
                    const bookBtn = document.createElement("a");
                    bookBtn.href = bookingUrl;
                    bookBtn.target = "_blank";
                    bookBtn.className = "booking-btn";
                    bookBtn.textContent = t.bookBtn;
                    botDiv.appendChild(bookBtn);
                }
            } catch (err) {
                clearTimeout(slowTimer);
                document.getElementById("slowMsg")?.remove();
                typing.remove();
                addMsg(t.serverErr, "bot");
            }

            if (logId) addRating(logId);

            // Re-enable input controls
            sendBtn.disabled = false;
            input.disabled = false;
            input.focus();
        }

        sendBtn.onclick = () => sendMsg();
        input.addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMsg();
            }
        });

        // Escape key to close chat window
        document.addEventListener("keydown", e => {
            if (e.key === "Escape" && windowBox.style.display === "flex") {
                closeBtn.click();
            }
        });

        // ── Theme ──────────────────────────────────────────────────────────────────

        function buildChips(suggestions) {
            const c = document.getElementById("suggestions");
            c.innerHTML = "";
            (suggestions || []).forEach(label => {
                const chip = document.createElement("div");
                chip.className = "chip";
                chip.textContent = label;
                chip.onclick = () => {
                    if (!chip.classList.contains('used')) {
                        sendMsg(label);
                        chip.classList.add('used');
                        chip.style.opacity = '0.5';
                        chip.style.cursor = 'default';
                    }
                };
                c.appendChild(chip);
            });
        }

        function applyTheme(theme) {
            const root = document.documentElement;
            root.style.setProperty('--chat-header', theme.headerColor || '#0d6efd');
            root.style.setProperty('--chat-bg', theme.backgroundColor || '#ffffff');
            root.style.setProperty('--chat-text', theme.textColor || '#000000');
            root.style.setProperty('--chat-icon', theme.iconColor || '#0d6efd');
            root.style.setProperty('--chat-chip-bg', theme.chipBackgroundColor || '#f0f0f0');
            root.style.setProperty('--chat-chip-hover', theme.chipHoverColor || '#e0e0e0');
            root.style.setProperty('--chat-chip-border', theme.chipBorderColor || '#ccc');

            document.getElementById("chatHeader").style.background = theme.headerColor || '#0d6efd';
            bubble.style.background = theme.iconColor || '#0d6efd';
            messages.style.background = theme.backgroundColor || '#ffffff';
            messages.style.color = theme.textColor || '#000000';

            bookingUrl = theme.bookingUrl || '';

            const bubbleAvatar = document.getElementById('bubbleAvatar');
            const bubbleEmoji = document.getElementById('bubbleEmoji');
            const headerAvatar = document.getElementById('headerAvatar');
            if (theme.avatarData) {
                bubbleAvatar.src = theme.avatarData; bubbleAvatar.style.display = 'block';
                bubbleEmoji.style.display = 'none'; bubble.style.padding = '0';
                headerAvatar.src = theme.avatarData; headerAvatar.style.display = 'inline-block';
            } else {
                bubbleAvatar.style.display = 'none'; bubbleEmoji.style.display = 'inline';
                headerAvatar.style.display = 'none';
            }

            const banner = document.getElementById('chatBanner');
            if (theme.bannerData) { banner.src = theme.bannerData; banner.style.display = 'block'; }
            else banner.style.display = 'none';

            let suggestions = [];
            if (theme.suggestionsJson) { try { suggestions = JSON.parse(theme.suggestionsJson); } catch (e) { } }
            buildChips(suggestions);

            bubble.classList.add('visible');
        }

        async function loadTheme() {
            try {
                const res = await fetch(API_THEME + "?t=" + Date.now());
                if (!res.ok) throw new Error();
                applyTheme(await res.json());
            } catch (e) { applyTheme({}); }
        }

        window.addEventListener('storage', e => { if (e.key === 'themeUpdated') loadTheme(); });

        // ── Init ───────────────────────────────────────────────────────────────────
        loadTheme();
        initLeadForm(); // Check if returning visitor should skip lead form
    </script>
</body>

</html>
