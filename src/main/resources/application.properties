spring.application.name=chatbot
# src/main/resources/application.properties
app.ai.nvidia.api-key=${NVIDIA_API_KEY:}
app.ai.nvidia.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
app.ai.nvidia.chat-model=${NVIDIA_CHAT_MODEL:nvidia/nemotron-3.5-lightning-30b-a3b}
app.ai.nvidia.embedding-model=${NVIDIA_EMBEDDING_MODEL:nvidia/nemotron-3-embed-1b}
app.ai.nvidia.embedding-dimensions=${NVIDIA_EMBEDDING_DIMENSIONS:2048}
app.ai.nvidia.timeout=${NVIDIA_API_TIMEOUT:120s}
# Use Render PORT environment variable, default 8080
server.port=${PORT:8080}

# Optional: Logging level
logging.level.root=INFO
# --- Database ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.org.springframework.web=INFO
logging.level.com.harmony.chatbot=INFO

spring.main.allow-circular-references=true

app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.chat.max-question-length=2000
app.chat.rate-limit-per-minute=20

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

spring.threads.virtual.enabled=true
